[project]
name = "payment-gateway-faststream"
version = "0.1.0"
description = "Payment gateway with provider integration"
authors = [
    {name = "psk", email = "shaban.benito.dimitri@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "aio-pika>=9.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "provider"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PT",
    "RUF",
]
ignore = ["A003", "B008", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["app", "provider"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["no-untyped-def"]
