services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-gateway-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: payment-gateway-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payment-gateway-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-gateway-api
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      BROKER_HOST: rabbitmq
      REDIS_HOST: redis
      PROVIDER_URL: http://provider:8001
      WEBHOOK_BASE_URL: http://gateway:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      provider:
        condition: service_healthy
    ports:
      - "8000:8000"

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-gateway-outbox-publisher
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      BROKER_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "scripts/run_outbox_publisher.py"]

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-gateway-consumer
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      BROKER_HOST: rabbitmq
      PROVIDER_URL: http://provider:8001
      WEBHOOK_BASE_URL: http://gateway:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      provider:
        condition: service_healthy
    command: ["python", "scripts/run_consumer.py"]

  provider:
    build:
      context: .
      dockerfile: Dockerfile.provider
    container_name: payment-gateway-provider
    env_file:
      - .env
    ports:
      - "8001:8001"
    environment:
      PROVIDER_WEBHOOK_SECRET: change-me-provider-webhook-secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:

